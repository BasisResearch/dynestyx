[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynestyx"
version = "0.4.0"
description = "Probabilistic programming for dynamical systems; support for NumPyro, continuous & discrete-time systems, stochastic & deterministic processes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Basis" },
]
keywords = [
    "machine learning",
    "statistics",
    "dynamical systems",
    "bayesian modeling",
    "jax",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "effectful>=0.4.0",
    "cuthbert==0.0.14",
    "cuthbertlib==0.0.14",
    "cd-dynamax>=0.4.1",
    "matplotlib>=3.10.7",
    # numpyro<0.21.0 fails to import against jax>=0.10 (removed xla_pmap_p);
    # keep this floor aligned with the jax floor below.
    "numpyro>=0.21.0",
    "pytest>=9.0.1",
    "arviz>=0.18.0,<1.0.0",
    "blackjax>=1.6",
    "pytkdocs-tweaks>=0.0.8",
    "mkdocstrings[python]>=1.0.1",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.8",
    "equinox>=0.13.2",
    "jaxtyping>=0.3.9",
    "diffrax>=0.7.2",
    "numpy>=2.0",
    "jax>=0.8.2",
    "jaxlib>=0.8.2",
    "tfp-nightly>=0.26.0dev20250530",
    "orbax-checkpoint<0.11.3; sys_platform == 'win32'"
]

[tool.hatch.build.targets.wheel]
packages = ["dynestyx"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "mike>=2.1.0",
    "mkdocs-material>=9.7.1",
    "mkdocs>=1.6.1,<2",
    "pytest>=9.0.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.11",
    "ty>=0.0.37",
    "typeguard>=2.13.3,<3",
    "mkdocs-jupyter>=0.25.1,<0.26.0",
    "nbconvert>=7",
    "seaborn>=0.13.2",
    "imageio>=2.37.2",
    "optax>=0.2.0",
    "exponax>=0.2.0",
]
pdes = [
  "exponax>=0.2.0",
]

[tool.ruff.lint]
select = [
  "F",       # pyflakes
  "I",       # isort
  "PERF",    # performance
  "UP"       # pyupgrade
]
ignore = [
  "F722",    # jaxtyping shape annotations use strings ruff treats as forward annotations
]

[tool.ty.src]
include = ["dynestyx", "tests"]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.ty.analysis]
replace-imports-with-any = [
  "blackjax.**",
  "cd_dynamax.**",
  "cuthbert.**",
  "cuthbertlib.**",
  "diffrax.**",
  "effectful.**",
  "equinox.**",
  "numpyro.**",
  "optax.**",
  "tensorflow_probability.**",
]
respect-type-ignore-comments = true

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=dynestyx,typeguard.typechecked"
